### docker-compose.override.yml (Staging/Production environment)
services:
  backend-api:       
    image: luongtuananh/mmdddshop-backend-api:${IMAGE_TAG:?IMAGE_TAG is required}       
    ports:
      - "127.0.0.1:${API_HOST_PORT}:${API_DOCKER_CONTAINER_PORT}"
    restart: always 
    # volumes:
    #     - ./mmdddshop-backend/src/API/Mmdddshop.API/logs:/app/logs
    #     - ./.env:/app/.env   

  frontend-admin:      
    image: luongtuananh/mmdddshop-frontend-admin:${IMAGE_TAG:?IMAGE_TAG is required}-${DEPLOY_ENV:?DEPLOY_ENV is required}             
    ports:
        - "127.0.0.1:${ADMIN_HOST_PORT}:${ADMIN_DOCKER_CONTAINER_PORT}"
    restart: always 
    # volumes:
    #     - ./mmdddshop-frontend-admin/src:/app/src
    #     - /app/node_modules                
  
  db-sqlserver:
    ports:
      - "127.0.0.1:${SQLSERVER_HOST_PORT}:${SQLSERVER_DOCKER_CONTAINER_PORT}"  
    restart: always    

  db-init:
    image: luongtuananh/mmdddshop-db-init:${IMAGE_TAG:?IMAGE_TAG is required}

  liquibase:
    image: luongtuananh/mmdddshop-liquibase:${IMAGE_TAG:?IMAGE_TAG is required}  
    restart: "no"    
  
  keycloak:
    image: luongtuananh/mmdddshop-keycloak:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:     
      KC_HOSTNAME: ${KC_HOSTNAME:?KC_HOSTNAME is required}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "127.0.0.1:${IDENTITY_HOST_PORT}:${IDENTITY_PORT}"
    command: start --optimized --import-realm
    restart: always
    