### docker-compose.override.yml (Development environment)
services:
  backend-api:      
    profiles: ["local-docker"]
    environment:
      - KEYCLOAK_METADATA_ADDRESS=http://keycloak:8080/realms/mmdddshop/.well-known/openid-configuration
    ports:
      - "${API_HOST_PORT}:${API_DOCKER_CONTAINER_PORT}"    
    # volumes:
    #     - ./mmdddshop-backend/src/API/Mmdddshop.API/logs:/app/logs       
    #     - ./.env:/app/.env    

  frontend-admin:     
    profiles: ["local-docker"]                  
    ports:
        - "${ADMIN_HOST_PORT}:${ADMIN_DOCKER_CONTAINER_PORT}"    
    # volumes:
    #     - .mmdddshop-frontend-admin:/app
    #     - /app/node_modules                

  db-sqlserver:      
    ports:
      - "${SQLSERVER_HOST_PORT}:${SQLSERVER_DOCKER_CONTAINER_PORT}"
       
  keycloak:  
    # volumes:
    #     - ./keycloak/import:/opt/keycloak/data/import:ro    
    ports:
      - "${IDENTITY_HOST_PORT}:${IDENTITY_PORT}"     