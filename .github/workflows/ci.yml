name: CI

on:
  pull_request:
    branches: [develop, main, "release/**"]
  push:
    branches: [develop]
  workflow_call:
  # workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true  # push liên tục thì huỷ lượt chạy cũ

permissions:
  contents: read

jobs:
  source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only release/* or hotfix/* may merge into main
        env:
          HEAD_REF: ${{ github.head_ref }}   # truyền qua env, tránh chèn tên nhánh thẳng vào script
        run: |
          case "$HEAD_REF" in
            release/*|hotfix/*) echo "OK: $HEAD_REF" ;;
            *) echo "::error::Only release/* or hotfix/* can be merged into main (got $HEAD_REF)"; exit 1 ;;
          esac
    
  backend:
    name: Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Mmdddshop.sln

      - name: Build
        run: dotnet build Mmdddshop.sln --configuration Release --no-restore

      - name: Unit + architecture tests
        run: dotnet test Mmdddshop.sln --configuration Release --no-build --filter "TestCategory!=Integration" --verbosity normal
        # integration tests with SQL Server - remove about filter (TestCategory!=Integration)

  frontend-admin:
    name: Frontend admin
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mmdddshop-frontend-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mmdddshop-frontend-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
 
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env from example
        run: cp .env.example .env

      - name: Validate compose (dev + server)
        run: |         
          docker compose config --quiet

          IMAGE_TAG=ci DEPLOY_ENV=ci KC_HOSTNAME=https://example.com \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Build all images (also validates base + override)
        run: docker compose --profile local-docker build
